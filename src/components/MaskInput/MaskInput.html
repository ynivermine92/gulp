<!-- Phone input -->
<!-- Что бы работал плагин просто к необходимому инпуту нужно добавить класс .phone__input -->

 <input class="phone__input" id="phone" name="phone"
                                placeholder="+38(099)123-45-67" type="tel"
                                pattern="\+38\(\d{3}\)\d{3}-\d{2}-\d{2}" required>
